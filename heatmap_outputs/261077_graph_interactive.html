"(249, 196)", "(229, 131)", "(488, 6)", "(230, 131)", "(489, 6)", "(489, 5)", "(249, 195)", "(0, 133)", "(227, 143)"]}, {"id": "(229, 132)", "x": 132, "y": -229, "centrality": 0.3528, "resilience_if_removed": 0.9716, "disconnected_if_removed": ["(499, 13)", "(229, 131)", "(488, 6)", "(230, 131)", "(489, 6)", "(489, 5)", "(0, 133)"]}, {"id": "(79, 216)", "x": 216, "y": -79, "centrality": 0.0625, "resilience_if_removed": 1.0431, "disconnected_if_removed": ["(72, 203)"]}, {"id": "(72, 203)", "x": 203, "y": -72, "centrality": 0.0, "resilience_if_removed": 1.0537, "disconnected_if_removed": []}, {"id": "(161, 165)", "x": 165, "y": -161, "centrality": 0.0, "resilience_if_removed": 1.0592, "disconnected_if_removed": []}, {"id": "(227, 143)", "x": 143, "y": -227, "centrality": 0.4335, "resilience_if_removed": 1.0239, "disconnected_if_removed": ["(229, 132)", "(499, 13)", "(229, 131)", "(488, 6)", "(230, 131)", "(489, 6)", "(489, 5)", "(0, 133)", "(161, 165)"]}, {"id": "(499, 13)", "x": 13, "y": -499, "centrality": 0.0, "resilience_if_removed": 1.0553, "disconnected_if_removed": []}, {"id": "(231, 168)", "x": 168, "y": -231, "centrality": 0.0, "resilience_if_removed": 1.0597, "disconnected_if_removed": []}], "edges": [{"source": "(95, 255)", "target": "(95, 254)"}, {"source": "(95, 255)", "target": "(96, 254)"}, {"source": "(95, 255)", "target": "(133, 358)"}, {"source": "(95, 254)", "target": "(96, 254)"}, {"source": "(95, 254)", "target": "(79, 216)"}, {"source": "(96, 254)", "target": "(127, 241)"}, {"source": "(250, 196)", "target": "(249, 195)"}, {"source": "(250, 196)", "target": "(249, 196)"}, {"source": "(250, 196)", "target": "(290, 246)"}, {"source": "(249, 195)", "target": "(249, 196)"}, {"source": "(249, 195)", "target": "(227, 143)"}, {"source": "(249, 196)", "target": "(158, 233)"}, {"source": "(127, 241)", "target": "(127, 240)"}, {"source": "(127, 241)", "target": "(128, 241)"}, {"source": "(127, 240)", "target": "(128, 241)"}, {"source": "(127, 240)", "targe const nodeById = {};
data.nodes.forEach(n => nodeById[n.id] = n);

function colorForCentrality(c, maxC) {
  const t = maxC > 0 ? c / maxC : 0;
  const stops = ['#FAECE7', '#F5C4B3', '#F0997B', '#D85A30', '#993C1D'];
  const idx = Math.min(stops.length - 1, Math.floor(t * (stops.length - 1)));
  return stops[idx];
}

const svg = document.getElementById('mapSvg');
const maxC = Math.max(...data.nodes.map(n => n.centrality), 0.0001);

data.edges.forEach(e => {
  const a = nodeById[e.source], b = nodeById[e.target];
  if (!a || !b) return;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
  line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
  line.setAttribute('stroke', '#ccc');
  line.setAttribute('stroke-width', '1.5');
  svg.appendChild(line);
});

data.nodes.forEach(n => {
  const r = 3 + 10 * (n.centrality / maxC);
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', n.x);
  circle.setAttribute('cy', n.y);
  circle.setAttribute('r', r);
  circle.setAttribute('fill', colorForCentrality(n.centrality, maxC));
  circle.setAttribute('stroke', '#333');
  circle.setAttribute('stroke-width', '0.5');
  circle.dataset.id = n.id;
  circle.addEventListener('click', () => selectNode(n.id));
  svg.appendChild(circle);
});

function selectNode(id) {
  const n = nodeById[id];
  document.getElementById('selNode').textContent = id;
  document.getElementById('selCentrality').textContent = n.centrality.toFixed(4);
  if (n.resilience_if_removed === null) {
    document.getElementById('selResilience').textContent = '(too large to precompute -- use live backend)';
  } else {
    const ri = n.resilience_if_removed;
    document.getElementById('selResilience').textContent = ri.toFixed(4) + (ri < 1 ? ' (efficiency drops)' : ' (negligible)');
  }
  svg.querySelectorAll('circle').forEach(c => {
    c.setAttribute('stroke', c.dataset.id === id ? '#D85A30' : '#333');
    c.setAttribute('stroke-width', c.dataset.id === id ? '2' : '0.5');
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('selNode').textContent = 'none';
  document.getElementById('selCentrality').textContent = '-';
  document.getElementById('selResilience').textContent = '-';
  svg.querySelectorAll('circle').forEach(c => {
    c.setAttribute('stroke', '#333');
    c.setAttribute('stroke-width', '0.5');
  });
});
