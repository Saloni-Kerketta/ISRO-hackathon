<!DOCTYPE html>

<style>

<body>
  <h1>Intersection Criticality Heatmap</h1>

    <div class="panel">

      <div class="card"><div class="label">Resilience index if removed</div><div class="value" id="selResilience">-</div></div>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

emoved": ["(509, 431)", "(501, 506)", "(502, 506)", "(500, 431)", "(501, 431)", "(502, 505)", "(500, 432)", "(509, 509)"]}, {"id": "(183, 303)", "x": 303, "y": -183, "centrality": 0.1129, "resilience_if_removed": 0.9397, "disconnected_if_removed": []}, {"id": "(183, 304)", "x": 304, "y": -183, "centrality": 0.0625, "resilience_if_removed": 0.9655, "disconnected_if_removed": ["(153, 508)"]}, {"id": "(184, 303)", "x": 303, "y": -184, "centrality": 0.0625, "resilience_if_removed": 0.9637, "disconnected_if_removed": ["(194, 302)"]}, {"id": "(405, 94)", "x": 94, "y": -405, "centrality": 0.0625, "resilience_if_removed": 0.9726, "disconnected_if_removed": ["(482, 0)"]}, {"id": "(405, 95)", "x": 95, "y": -405, "centrality": 0.2258, "resilience_if_removed": 0.9567, "disconnected_if_removed": ["(360, 0)", "(404, 94)", "(482, 0)", "(405, 94)"]}, {"id": "(0, 358)", "x": 358, "y": 0, "centrality": 0.0, "resilience_if_removed": 1.0569, "disconnected_if_removed": []}, {"id": "(194, 302)", "x": 302, "y": -194, "centrality": 0.0, "resilience_if_removed": 1.0497, "disconnected_if_removed": []}, {"id": "(482, 0)", "x": 0, "y": -482, "centrality": 0.0, "resilience_if_removed": 1.0606, "disconnected_if_removed": []}, {"id": "(509, 509)", "x": 509, "y": -509, "centrality": 0.0, "resilience_if_removed": 1.0481, "disconnected_if_removed": []}, {"id": "(153, 508)", "x": 508, "y": -153, "centrality": 0.0, "resilience_if_removed": 1.0622, "disconnected_if_removed": []}, {"id": "(4, 321)", "x": 321, "y": -4, "centrality": 0.0, "resilience_if_removed": 1.0598, "disconnected_if_removed": []}], "edges": [{"source": "(410, 114)", "target": "(409, 113)"}, {"source": "(410, 114)", "target": "(409, 114)"}, {"source": "(410, 114)", "target": "(411, 114)"}, {"source": "(409, 113)", "target": "(409, 114)"}, {"source": "(409, 113)", "target": "(405, 95)"}, {"source": "(409, 114)", "target": "(150, 206)"}, {"source": "(411, 114)", "target": "(412, 114)"}, {"source": "(411, 114)", "target": "(412, 115)"}, {"source": "(502, 505)", "target": "(501, 506)"}, {"source": "(502, 505)", "target": "(502, 506)"}, {"source": "(502, 505)", "target": "(500, 432)"}, {"source": "(501, 506)", "target": "(502, 506)"}, {"source": "(502, 506)", "target": "(509, 509)"}, {"source": "(150, 206)", "target": "(194, 221)"}, {"source": "(150, 206)", "target": "(88, 292)"}, {"source": "(88, 292)", "target": "(182, 303)"}, {"source": "(88, 292)", "target": "(5, 351)"}, {"source": "(182, 303)", "target": "(183, 303)"}, {"source": "(182, 303)", "target": "(183, 304)"}, {"source": "(5, 351)", "target": "(0, 358)"}, {"source": "(5, 351)", "target": "(4, 321)"}, {"source": "(360, 0)", "target": "(404, 94)"}, {"source": "(404, 94)", "target": "(405, 94)"}, {"source": "(404, 94)", "target": "(405, 95)"}, {"source": "(500, 432)", "target": "(500, 431)"}, {"source": "(500, 432)", "target": "(501, 431)"}, {"source": "(500, 431)", "target": "(500, 430)"}, {"source": "(500, 431)", "target": "(501, 431)"}, {"source": "(501, 431)", "target": "(509, 431)"}, {"source": "(501, 431)", "target": "(500, 430)"}, {"source": "(412, 114)", "target": "(412, 115)"}, {"source": "(412, 114)", "target": "(511, 106)"}, {"source": "(412, 115)", "target": "(500, 430)"}, {"source": "(183, 303)", "target": "(183, 304)"}, {"source": "(183, 303)", "target": "(184, 303)"}, {"source": "(183, 304)", "target": "(153, 508)"}, {"source": "(183, 304)", "target": "(184, 303)"}, {"source": "(184, 303)", "target": "(194, 302)"}, {"source": "(405, 94)", "target": "(482, 0)"}, {"source": "(405, 94)", "target": "(405, 95)"}], "baseline_efficiency": 0.177726, "precomputed_resilience": true};
const nodeById = {};
data.nodes.forEach(n => nodeById[n.id] = n);

function colorForCentrality(c, maxC) {
  const t = maxC > 0 ? c / maxC : 0;
  const stops = ['#FAECE7', '#F5C4B3', '#F0997B', '#D85A30', '#993C1D'];
  const idx = Math.min(stops.length - 1, Math.floor(t * (stops.length - 1)));
  return stops[idx];
}

const svg = document.getElementById('mapSvg');
const maxC = Math.max(...data.nodes.map(n => n.centrality), 0.0001);

data.edges.forEach(e => {
  const a = nodeById[e.source], b = nodeById[e.target];
  if (!a || !b) return;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
  line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
  line.setAttribute('stroke', '#ccc');
  line.setAttribute('stroke-width', '1.5');
  svg.appendChild(line);
});

data.nodes.forEach(n => {
  const r = 3 + 10 * (n.centrality / maxC);
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', n.x);
  circle.setAttribute('cy', n.y);
  circle.setAttribute('r', r);
  circle.setAttribute('fill', colorForCentrality(n.centrality, maxC));
  circle.setAttribute('stroke', '#333');
  circle.setAttribute('stroke-width', '0.5');
  circle.dataset.id = n.id;
  circle.addEventListener('click', () => selectNode(n.id));
  svg.appendChild(circle);
});

function selectNode(id) {
  const n = nodeById[id];
  document.getElementById('selNode').textContent = id;
  document.getElementById('selCentrality').textContent = n.centrality.toFixed(4);
  if (n.resilience_if_removed === null) {
    document.getElementById('selResilience').textContent = '(too large to precompute -- use live backend)';
  } else {
    const ri = n.resilience_if_removed;
    document.getElementById('selResilience').textContent = ri.toFixed(4) + (ri < 1 ? ' (efficiency drops)' : ' (negligible)');
  }
  svg.querySelectorAll('circle').forEach(c => {
    c.setAttribute('stroke', c.dataset.id === id ? '#D85A30' : '#333');
    c.setAttribute('stroke-width', c.dataset.id === id ? '2' : '0.5');
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('selNode').textContent = 'none';
  document.getElementById('selCentrality').textContent = '-';
  document.getElementById('selResilience').textContent = '-';
  svg.querySelectorAll('circle').forEach(c => {
    c.setAttribute('stroke', '#333');
    c.setAttribute('stroke-width', '0.5');
  });
});
</script>
</body>
</html>
